<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENTRY | SOUND-ISM 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Noto+Sans+JP:wght@400;700;900&family=Tourney:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#ff1438',
              crimson: '#99001b',
              dark: '#08080a',
              card: '#121216',
              border: '#2a2a35'
            }
          },
          fontFamily: {
            headline: ['"Bebas Neue"', '"Anton"', 'sans-serif'],
            tourney: ['"Tourney"', 'sans-serif'],
            montserrat: ['"Montserrat"', '"Noto Sans JP"', 'sans-serif'],
            jp: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #08080a;
      color: #f3f4f6;
      font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      word-break: auto-phrase;
    }
    .halftone-bg {
      background-image: radial-gradient(rgba(255, 20, 56, 0.15) 1.5px, transparent 1.5px), radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .noise-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
      opacity: 0.035;
      background: repeating-radial-gradient(#fff 0 0.0001%, #000 0 0.0002%);
      background-size: 200px 200px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* フォームiframe用のレスポンシブ高さ制御 */
    .form-iframe {
      width: 100%;
      height: 1650px; /* PC用表示の高さ */
      border: none;
      background: transparent;
      display: block;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      .form-iframe {
        /* スマホ用：各項目が縦並びになり長くなるため拡張し、内側スクロールを解消 */
        height: 2250px;
      }
    }
  </style>
</head>
<body class="halftone-bg relative min-h-screen selection:bg-brand-red selection:text-white flex flex-col justify-between">

  <div class="noise-overlay"></div>

  <!-- ナビゲーションバー -->
  <header class="fixed top-0 left-0 w-full z-50 backdrop-blur-md bg-black/90 border-b border-white/10 px-3 sm:px-8 py-2.5 flex items-center justify-between">
    <div class="flex items-center space-x-2 shrink-0">
      <a href="index.html" class="flex items-center gap-1.5 sm:gap-2 group">
        <img 
          src="images/logo.png" 
          alt="SOUND-ISM" 
          class="h-6 sm:h-9 w-auto object-contain transition-transform group-hover:scale-105"
          onerror="this.onerror=null; this.src='images/logo.PNG'; this.onerror=function(){this.src='images/logo.jpg'; this.onerror=function(){this.src='images/logo.JPG'; this.onerror=function(){this.src='images/IMG_0394.jpg';}};};"
        />
        <span class="text-brand-red font-tourney text-lg sm:text-2xl font-black italic tracking-wider drop-shadow-[0_0_10px_rgba(255,20,56,0.5)]">
          2027
        </span>
      </a>
    </div>
    
    <nav class="flex items-center space-x-3 sm:space-x-5 overflow-x-auto no-scrollbar text-xs sm:text-base font-headline tracking-widest uppercase font-bold pl-3">
      <a href="index.html" class="text-gray-300 hover:text-brand-red transition whitespace-nowrap">TOP</a>
      <a href="news.html" class="text-gray-300 hover:text-brand-red transition whitespace-nowrap">NEWS</a>
      <a href="price.html" class="text-gray-300 hover:text-brand-red transition whitespace-nowrap">PRICE</a>
      <a href="entry.html" class="text-brand-red hover:text-white transition whitespace-nowrap">ENTRY</a>
      <a href="schedule.html" class="text-gray-300 hover:text-brand-red transition whitespace-nowrap">SCHEDULE</a>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-grow pt-28 sm:pt-36 pb-16 px-2 sm:px-4 max-w-4xl mx-auto w-full">
    <!-- ENTRY INFORMATION 見出し -->
    <div class="border-t border-b border-white/10 py-3 mb-6 sm:mb-8 flex items-center justify-between">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <h1 class="font-headline text-3xl sm:text-4xl tracking-wider text-white">
          <span class="text-brand-red">ENTRY</span> INFORMATION
        </h1>
      </div>
      <span class="text-[10px] sm:text-xs font-mono text-gray-500 uppercase tracking-widest">REGISTRATION</span>
    </div>

    <!-- GASエントリーフォーム埋め込みコンテナ -->
    <div class="w-full">
      <iframe 
        src="https://script.google.com/macros/s/AKfycbzsJJU1_T5Y8N0pxfKUHQLY7mL0by_dEHpMEz_yhyEGaPaHzopmR2qZuCWZ4arit8K0/exec" 
        class="form-iframe"
        scrolling="no"
        loading="lazy"
      ></iframe>
    </div>
  </main>

  <!-- フッター -->
  <footer class="border-t border-white/10 bg-black/90 py-6 sm:py-8 px-4 text-center text-xs text-gray-500">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
      <div class="flex items-center gap-2">
        <img 
          src="images/logo.png" 
          alt="SOUND-ISM" 
          class="h-7 sm:h-8 w-auto object-contain"
          onerror="this.onerror=null; this.src='images/logo.PNG'; this.onerror=function(){this.src='images/logo.jpg'; this.onerror=function(){this.src='images/logo.JPG'; this.onerror=function(){this.src='images/IMG_0394.jpg';}};};"
        />
        <span class="text-brand-red font-tourney text-xl sm:text-2xl font-black italic tracking-widest drop-shadow-[0_0_10px_rgba(255,20,56,0.5)]">2027</span>
      </div>
      <p class="text-[11px] sm:text-xs">© 2027 SOUND-ISM PROJECT. ALL RIGHTS RESERVED.</p>
    </div>
  </footer>

</body>
</html>

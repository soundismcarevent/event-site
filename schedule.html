  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#ff1438',
              crimson: '#99001b',
              dark: '#08080a',
              card: '#121216',
              border: '#2a2a35'
            }
          },
          fontFamily: {
            headline: ['"Bebas Neue"', '"Anton"', 'sans-serif'],
            tourney: ['"Tourney"', 'sans-serif'],
            montserrat: ['"Montserrat"', '"Noto Sans JP"', 'sans-serif'],
            jp: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #08080a;
      color: #f3f4f6;
      font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      word-break: auto-phrase;
    }
    .halftone-bg {
      background-image: radial-gradient(rgba(255, 20, 56, 0.15) 1.5px, transparent 1.5px), radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .noise-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
      opacity: 0.035;
      background: repeating-radial-gradient(#fff 0 0.0001%, #000 0 0.0002%);
      background-size: 200px 200px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="halftone-bg relative min-h-screen selection:bg-brand-red selection:text-white flex flex-col justify-between">

  <!-- ナビゲーションバー -->

        />

    <div class="border-t border-b border-white/10 py-3 mb-8 flex items-center justify-between">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <h1 class="font-headline text-3xl sm:text-4xl tracking-wider text-white">
          TIME <span class="text-brand-red">SCHEDULE</span>

      </div>
      <span class="text-[10px] sm:text-xs font-mono text-gray-500 uppercase tracking-widest">EVENT TIMETABLE</span>

    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
      <div class="flex items-center gap-2">
        <img 
          src="images/logo.png" 
          alt="SOUND-ISM" 
          class="h-7 sm:h-8 w-auto object-contain"

</html>
